name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1

      - name: Resolve dependencies past the cooldown
        # Cargo.lock is not committed, so resolve one that skips crates published in the last 7 days, which Aegis blocks.
        env:
          CARGO_COOLDOWN_VERSION: "0.3.4"
          CARGO_COOLDOWN_ARCHIVE_SHA256: 5706c1636415b90ec8244631ff707d1c49d502779d14235d7abb65c080ac8ba6
          CARGO_COOLDOWN_BINARY_SHA256: c9939a37768c7d0e4dbac047ea2d2e41bd1e0276db4da3752e200dd5722d1f6e
          CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE: 7 days
          COOLDOWN_INCOMPATIBLE_PUBLISH_AGE: deny
          COOLDOWN_LOCKFILE_BASELINE: ignore
        run: |
          set -euo pipefail
          root="cargo-cooldown-x86_64-unknown-linux-gnu-v${CARGO_COOLDOWN_VERSION}"
          tmp="${RUNNER_TEMP}/cargo-cooldown"
          mkdir -p "$tmp"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "$tmp/$root.tgz" \
            "https://github.com/dertin/cargo-cooldown/releases/download/v${CARGO_COOLDOWN_VERSION}/$root.tgz"
          echo "$CARGO_COOLDOWN_ARCHIVE_SHA256  $tmp/$root.tgz" | sha256sum --check --strict
          tar -xzf "$tmp/$root.tgz" -C "$tmp"
          echo "$CARGO_COOLDOWN_BINARY_SHA256  $tmp/$root/cargo-cooldown" | sha256sum --check --strict
          "$tmp/$root/cargo-cooldown" cooldown update

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464

      - name: Check needed jobs
        uses: tempoxyz/gh-actions/actions/check-needs@68a1e4645c9596fee5398dd1e2ba07f0a4aa6a71 # 2026-10-20T04-40-18Z-68a1e464
        with:
          jobs: ${{ toJSON(needs) }}
